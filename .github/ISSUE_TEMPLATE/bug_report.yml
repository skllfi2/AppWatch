name: 🐛 Bug Report
description: Create a report to help us fix a bug in AppWatch
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem! Please make sure your report includes enough details to reproduce the issue.
  - type: input
    id: version
    attributes:
      label: AppWatch Version
      description: What version of AppWatch are you using? (Check Settings > About)
      placeholder: "e.g. 0.2.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows Version
      options:
        - Windows 11 (23H2 or newer)
        - Windows 11 (22H2 or older)
        - Windows 10 (22H2)
        - Windows 10 (older)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to 'Tracked Apps'
        2. Click on 'Scan System'
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any error messages or relevant logs from `%APPDATA%\AppWatch`.
      render: shell
