name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_CULTURE: en-US
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet nuget locals all --clear
          dotnet restore src/AppWatch.App/AppWatch.App.csproj -v detailed 2>&1 | tee restore.log

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log
          path: restore.log

      - name: Patch XAML compiler config for en-US locale (WinUI 2.3.9/2.6.4 locale bug workaround)
        run: |
          $xamlCompiler = Get-ChildItem ~/.nuget/packages/microsoft.windowsappsdk.winui/*/tools/net472/Microsoft.UI.Xaml.Markup.Compiler.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($xamlCompiler) {
            $configPath = "$($xamlCompiler.FullName).config"
            $configContent = @"
<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <system.globalization>
    <globalization culture="en-US" uiCulture="en-US" />
  </system.globalization>
  <runtime>
    <AppDomainResourceAssemblyResolver enabled="true" />
  </runtime>
</configuration>
"@
            [System.IO.File]::WriteAllText($configPath, $configContent)
            Write-Host "Patched $configPath"
          } else {
            Write-Warning "XAML compiler not found"
          }

      - name: List resolved packages (verify WinUI version)
        run: dotnet list src/AppWatch.App/AppWatch.App.csproj package --include-transitive | grep -i winui || true

      - name: Build
        run: |
          dotnet build src/AppWatch.App/AppWatch.App.csproj -c Release -p:Platform=x64 -v detailed 2>&1 | tee build.log
          echo "=== BUILD EXIT CODE: ${PIPESTATUS[0]} ==="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Test
        run: dotnet test tests/AppWatch.Core.Tests/AppWatch.Core.Tests.csproj -c Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  # Separate job for code analysis (runs on ubuntu for faster feedback)
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Run analyzers
        run: dotnet build src/AppWatch.App/AppWatch.App.csproj -c Release --no-restore /p:RunAnalyzers=true /p:TreatWarningsAsErrors=true 2>&1 | tee analyze.log

      - name: Upload analysis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-log
          path: analyze.log

      - name: Check formatting (EditorConfig)
        run: |
          dotnet format --verify-no-changes --verbosity detailed 2>&1 | tee format.log || echo "::warning::Code formatting issues found. Run 'dotnet format' locally."

      - name: Upload format log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-log
          path: format.log
