name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_CULTURE: en-US
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false

jobs:
  release:
    name: Create Release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/AppWatch.App/AppWatch.App.csproj -v detailed

      - name: Patch XAML compiler config for en-US locale
        run: |
          $xamlCompiler = Get-ChildItem ~/.nuget/packages/microsoft.windowsappsdk.winui/*/tools/net472/Microsoft.UI.Xaml.Markup.Compiler.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($xamlCompiler) {
            $configPath = "$($xamlCompiler.FullName).config"
            $configContent = @"
<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <system.globalization>
    <globalization culture="en-US" uiCulture="en-US" />
  </system.globalization>
  <runtime>
    <AppDomainResourceAssemblyResolver enabled="true" />
  </runtime>
</configuration>
"@
            [System.IO.File]::WriteAllText($configPath, $configContent)
          }

      - name: Build Release
        run: dotnet build src/AppWatch.App/AppWatch.App.csproj -c Release -p:Platform=x64 -v detailed 2>&1 | tee build.log

      - name: Run Tests
        run: dotnet test tests/AppWatch.Core.Tests/AppWatch.Core.Tests.csproj -c Release --no-build

      - name: Publish (self-contained, single file)
        run: |
          dotnet publish src/AppWatch.App/AppWatch.App.csproj             -c Release             -p:Platform=x64             -p:PublishSingleFile=true             -p:SelfContained=true             -p:PublishReadyToRun=true             -p:PublishTrimmed=false             -p:IncludeNativeLibrariesForSelfExtract=true             -o ./artifacts/publish             -v detailed

      - name: Velopack Pack
        if: env.VELOPACK_ENABLED == 'true'
        run: |
          dotnet tool install -g velopack --version 1.2.161
          velopack pack -p ./artifacts/publish -u https://github.com/skllfi2/AppWatch/releases -o ./artifacts/velopack

      - name: Create SHA256 checksums
        run: |
          cd ./artifacts/publish
          Get-FileHash -Algorithm SHA256 *.exe,*.dll | ForEach-Object { "$($_.Hash)  $($_.Path)" } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Changelog
        id: changelog
        run: |
          $tag = "${{ github.ref_name }}"
          $prevTag = git describe --tags --abbrev=0 $tag^ 2>$null
          if (-not $prevTag) { $prevTag = "" }
          $log = git log $prevTag..$tag --pretty=format:"- %s (%an)" --reverse
          $changelog = "## $tag

$log
"
          $changelog | Out-File -Encoding utf8 CHANGELOG_RELEASE.md
          echo "changelog<<EOF" >> $env:GITHUB_OUTPUT
          cat CHANGELOG_RELEASE.md >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AppWatch ${{ github.ref_name }}
          body_path: ./artifacts/publish/CHANGELOG_RELEASE.md
          files: |
            ./artifacts/publish/*.exe
            ./artifacts/publish/*.dll
            ./artifacts/publish/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload artifacts for winget PR job
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts/publish/**

  winget-pr:
    name: Create winget-pkgs PR
    needs: release
    runs-on: ubuntu-latest
    if: github.repository == 'skllfi2/AppWatch' && !contains(github.ref_name, '-')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Extract version and checksum
        id: metadata
        run: |
          EXE=$(find ./artifacts -name "*.exe" -not -name "*.pdb" | head -1)
          VERSION=$(basename $EXE | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          SHA256=$(sha256sum $EXE | cut -d' ' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "exe=$EXE" >> $GITHUB_OUTPUT

      - name: Create winget manifest PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          repository: microsoft/winget-pkgs
          base: master
          branch: appwatch-${{ steps.metadata.outputs.version }}
          title: "Update AppWatch to ${{ steps.metadata.outputs.version }}"
          body: |
            Automated PR for AppWatch v${{ steps.metadata.outputs.version }}

            SHA256: ${{ steps.metadata.outputs.sha256 }}
            Installer URL: https://github.com/skllfi2/AppWatch/releases/download/v${{ steps.metadata.outputs.version }}/$(basename ${{ steps.metadata.outputs.exe }})
          commit-message: "Update AppWatch to ${{ steps.metadata.outputs.version }}"
          labels: "automated, update"
