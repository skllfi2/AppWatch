name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Install vpk (Velopack)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk

      - name: Pack release
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk pack -u AppWatch -v ${{ github.ref_name }}
          -o dist --mainExe AppWatch.App.exe --packTitle "AppWatch"
          src\AppWatch.App\bin\Release\net10.0-windows

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: AppWatch-${{ github.ref_name }}
          path: dist/**
