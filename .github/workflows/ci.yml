name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_CULTURE: en-US
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false

jobs:
  build-test:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet nuget locals all --clear
          dotnet restore src/AppWatch.App/AppWatch.App.csproj -v detailed 2>&1 | tee restore.log

      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log
          path: restore.log

      - name: Patch XAML compiler config for en-US locale
        run: |
          $xamlCompiler = Get-ChildItem ~/.nuget/packages/microsoft.windowsappsdk.winui/*/tools/net472/Microsoft.UI.Xaml.Markup.Compiler.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($xamlCompiler) {
            $configPath = "$($xamlCompiler.FullName).config"
            $configContent = @"
<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <system.globalization>
    <globalization culture="en-US" uiCulture="en-US" />
  </system.globalization>
  <runtime>
    <AppDomainResourceAssemblyResolver enabled="true" />
  </runtime>
</configuration>
"@
            [System.IO.File]::WriteAllText($configPath, $configContent)
            Write-Host "Patched $configPath"
          } else {
            Write-Warning "XAML compiler not found"
          }

      - name: List resolved packages
        run: dotnet list src/AppWatch.App/AppWatch.App.csproj package --include-transitive | grep -i winui || true

      - name: Show feed sources
        run: dotnet nuget list source

      # VCRTForwarders' UseDebugCRT inline task uses CodeTaskFactory which .NET Core
      # MSBuild cannot run (MSB4801) — the task only decides whether to ship DEBUG CRT
      # dlls, which a Release distribution never wants. The property short-circuits it.
      # (The package skips the task automatically in Debug — that's why local Debug builds pass.)
      - name: Build App (x64 Release)
        run: |
          dotnet build src/AppWatch.App/AppWatch.App.csproj -c Release -p:Platform=x64 -p:VCRTForwarders-IncludeDebugCRT=false -v detailed 2>&1 | tee build.log
          echo "=== BUILD EXIT CODE: ${PIPESTATUS[0]} ==="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Build Tests
        run: dotnet build tests/AppWatch.Core.Tests/AppWatch.Core.Tests.csproj -c Release

      # dotnet test's MTP bridge exits 5 ("zero tests") since Microsoft.NET.Test.Sdk 18.11 —
      # run the xunit v3 console exe directly instead.
      - name: Test
        run: |
          $exe = "tests/AppWatch.Core.Tests/bin/Release/net10.0/AppWatch.Core.Tests.exe"
          if (-not (Test-Path $exe)) { throw "test exe not found: $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "tests OK"

      # ── tag vX.Y.Z → publish + vpk pack + portable zip + GitHub Release ──

      - name: Publish (win-x64, self-contained)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/AppWatch.App/AppWatch.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:VCRTForwarders-IncludeDebugCRT=false -o publish

      - name: Install vpk (Velopack)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk

      # vpk output: AppWatch-win-Setup.exe (installer), AppWatch-win-Portable.zip
      # (AppWatch.exe at zip root — SelfUpdateService's self-update target),
      # full .nupkg + releases.win.json (Velopack update feed with SHA256 digests).
      - name: vpk pack
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & vpk pack `
            --packId AppWatch `
            --packVersion $version `
            --packTitle "AppWatch" `
            --packDir publish `
            --mainExe AppWatch.exe `
            --outputDir dist
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AppWatch ${{ github.ref_name }}
          body: |
            AppWatch ${{ github.ref_name }}

            Assets:
            - AppWatch-win-Portable.zip — portable build (self-update target)
            - AppWatch-win-Setup.exe — Velopack installer
            - *.nupkg + releases.win.json — Velopack update feed
          files: |
            dist/AppWatch-win-Portable.zip
            dist/AppWatch-win-Setup.exe
            dist/*.nupkg
            dist/releases.win.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
