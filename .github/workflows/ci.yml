name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-test:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add Microsoft public feed (WinUI 2.5.1+)
        run: dotnet nuget add source "https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json" -n "dotnet-public"

      # VCRTForwarders' UseDebugCRT inline task uses CodeTaskFactory which .NET Core
      # MSBuild cannot run (MSB4801) — the task only decides whether to ship DEBUG CRT
      # dlls, which a Release distribution never wants. The property short-circuits it.
      # (The package skips the task automatically in Debug — that's why local Debug builds pass.)
      - name: Build App (x64 Release)
        run: dotnet build src/AppWatch.App/AppWatch.App.csproj -c Release -p:Platform=x64 -p:VCRTForwarders-IncludeDebugCRT=false

      - name: Build Tests
        run: dotnet build tests/AppWatch.Core.Tests/AppWatch.Core.Tests.csproj -c Release

      # dotnet test's MTP bridge exits 5 ("zero tests") since Microsoft.NET.Test.Sdk 18.11 —
      # run the xunit v3 console exe directly instead.
      - name: Test
        run: |
          $exe = "tests/AppWatch.Core.Tests/bin/Release/net10.0/AppWatch.Core.Tests.exe"
          if (-not (Test-Path $exe)) { throw "test exe not found: $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "tests OK"

      # ── tag vX.Y.Z → publish + vpk pack + portable zip + GitHub Release ──

      - name: Publish (win-x64, self-contained)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/AppWatch.App/AppWatch.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:VCRTForwarders-IncludeDebugCRT=false -o publish

      - name: Install vpk (Velopack)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk

      # vpk output: AppWatch-win-Setup.exe (installer), AppWatch-win-Portable.zip
      # (AppWatch.exe at zip root — SelfUpdateService's self-update target),
      # full .nupkg + releases.win.json (Velopack update feed with SHA256 digests).
      - name: vpk pack
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & vpk pack `
            --packId AppWatch `
            --packVersion $version `
            --packTitle "AppWatch" `
            --packDir publish `
            --mainExe AppWatch.exe `
            --outputDir dist
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AppWatch ${{ github.ref_name }}
          body: |
            AppWatch ${{ github.ref_name }}

            Assets:
            - AppWatch-win-Portable.zip — portable build (self-update target)
            - AppWatch-win-Setup.exe — Velopack installer
            - *.nupkg + releases.win.json — Velopack update feed
          files: |
            dist/AppWatch-win-Portable.zip
            dist/AppWatch-win-Setup.exe
            dist/*.nupkg
            dist/releases.win.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
